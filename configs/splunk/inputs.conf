# Splunk Universal Forwarder inputs for Windows hosts.
# Location: C:\Program Files\SplunkUniversalForwarder\etc\system\local\inputs.conf
# Do not edit the copy in etc\system\default. Restart the forwarder after changes.

[WinEventLog://Application]
index = endpoint
disabled = false

[WinEventLog://Security]
index = endpoint
disabled = false

[WinEventLog://System]
index = endpoint
disabled = false

[WinEventLog://Microsoft-Windows-Sysmon/Operational]
index = endpoint
disabled = false
renderXml = true
source = XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
